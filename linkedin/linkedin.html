<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinkedIn - Baba Cln</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --forest: #3f5f4a;
            --forest-dark: #2d4637;
            --forest-deep: #22362b;
            --moss: #6d8a68;
            --sage: #d9e6d5;
            --cream: #f8f7f2;
            --ink: #28312b;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 48px clamp(20px, 5vw, 80px);
            color: var(--ink);
            background: var(--cream);
            font-family: "DM Sans", sans-serif;
        }

        .page {
            width: min(100%, 1584px);
            margin: 0 auto;
        }

        .page-header {
            display: flex;
            align-items: end;
            justify-content: space-between;
            gap: 24px;
            margin-bottom: 24px;
        }

        .page-header h1 {
            margin: 0;
            color: var(--forest-dark);
            font: 700 clamp(1.8rem, 4vw, 3.2rem)/1.1 "Playfair Display", Georgia, serif;
        }

        .page-header p {
            margin: 8px 0 0;
            color: var(--moss);
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 0.15em;
            text-transform: uppercase;
        }

        .artboard {
            overflow: hidden;
            background: white;
            box-shadow: 0 24px 70px rgba(35, 54, 43, 0.15);
        }

        .banner {
            aspect-ratio: 1584 / 396;
            width: 100%;
        }

        svg {
            display: block;
            width: 100%;
            height: 100%;
        }

        .logo-section {
            display: grid;
            grid-template-columns: minmax(180px, 400px) 1fr;
            align-items: center;
            gap: clamp(28px, 7vw, 120px);
            max-width: 760px;
            margin: 64px auto 0;
        }

        .logo {
            width: 100%;
            aspect-ratio: 1;
        }

        .logo-note {
            max-width: 320px;
        }

        .logo-note h2 {
            margin: 0 0 12px;
            color: var(--forest-dark);
            font: 700 2rem/1.1 "Playfair Display", Georgia, serif;
        }

        .logo-note p {
            margin: 0;
            color: #667068;
            line-height: 1.7;
        }

        @media (max-width: 640px) {
            body { padding: 28px 16px; }
            .page-header { display: block; }
            .logo-section { grid-template-columns: 1fr; margin-top: 40px; }
            .logo { max-width: 260px; margin: 0 auto; }
        }
    </style>
</head>
<body>
    <main class="page">
        <header class="page-header">
            <div>
                <h1>Baba Cln</h1>
                <p>LinkedIn identity</p>
            </div>
            <p>1584 &times; 396 px</p>
        </header>

        <section class="artboard banner" aria-label="Banniere LinkedIn de Baba Cln">
            <svg viewBox="0 0 1584 396" role="img" aria-labelledby="banner-title banner-description" xmlns="http://www.w3.org/2000/svg">
                <title id="banner-title">Banniere LinkedIn de Baba Cln</title>
                <desc id="banner-description">Identite verte et creme pour un animateur nature.</desc>
                <rect width="1584" height="396" fill="#f8f7f2"/>
                <path d="M0 0h520c-58 74-70 160-33 246 19 43 53 94 106 150H0V0Z" fill="#d9e6d5"/>
                <path d="M0 0h164c-21 100-3 186 54 258 27 34 61 79 98 138H0V0Z" fill="#6d8a68" opacity=".3"/>
                <path d="M1166 0h418v396h-505c79-66 126-128 146-187 23-69 3-139-59-209Z" fill="#3f5f4a"/>
                <path d="M1395 0h189v396h-204c45-99 65-186 54-260-7-48-20-93-39-136Z" fill="#22362b"/>
                <g fill="none" stroke="#8aa27e" stroke-width="2" opacity=".9">
                    <path d="M1241 397c25-90 28-180 5-270-8-30-20-63-38-98"/>
                    <path d="M1309 397c-13-86 2-169 45-247 22-40 49-76 81-108"/>
                    <path d="M1475 396c-23-87-20-165 10-235 17-40 42-79 76-116"/>
                </g>
                <g fill="#8aa27e" opacity=".65">
                    <ellipse cx="1234" cy="103" rx="12" ry="48" transform="rotate(-35 1234 103)"/>
                    <ellipse cx="1280" cy="158" rx="13" ry="52" transform="rotate(48 1280 158)"/>
                    <ellipse cx="1355" cy="91" rx="12" ry="45" transform="rotate(48 1355 91)"/>
                    <ellipse cx="1427" cy="188" rx="12" ry="50" transform="rotate(-42 1427 188)"/>
                    <ellipse cx="1512" cy="102" rx="12" ry="48" transform="rotate(38 1512 102)"/>
                </g>
                <g transform="translate(388 105)">
                    <text x="0" y="34" fill="#6d8a68" font-size="18" font-weight="700" letter-spacing="5" font-family="DM Sans, sans-serif">BAPTISTE CALIN</text>
                    <text x="0" y="105" fill="#2d4637" font-size="64" font-weight="700" font-family="Playfair Display, Georgia, serif">Animateur</text>
                    <path d="M3 134h84" stroke="#6d8a68" stroke-width="3"/>
                    <text x="0" y="177" fill="#667068" font-size="24" font-family="DM Sans, sans-serif">Transmettre, faire decouvrir, faire grandir.</text>
                    <text x="0" y="226" fill="#667068" font-size="17" letter-spacing="2" font-family="DM Sans, sans-serif">JEU  /  EXPERIMENTATION  /  COOPERATION</text>
                </g>
            </svg>
        </section>

        <section class="logo-section">
            <div class="artboard logo" aria-label="Logo rond B de Baba Cln">
                <svg viewBox="0 0 400 400" role="img" aria-labelledby="logo-title" xmlns="http://www.w3.org/2000/svg">
                    <title id="logo-title">Logo rond B de Baba Cln</title>
                    <circle cx="200" cy="200" r="200" fill="#3f5f4a"/>
                    <circle cx="200" cy="200" r="174" fill="none" stroke="#d9e6d5" stroke-width="2" opacity=".72"/>
                    <path d="M72 300c67-28 111-77 132-148 10-35 14-74 12-116" fill="none" stroke="#8aa27e" stroke-width="2" opacity=".85"/>
                    <ellipse cx="95" cy="267" rx="11" ry="43" fill="#8aa27e" opacity=".8" transform="rotate(48 95 267)"/>
                    <ellipse cx="178" cy="133" rx="11" ry="42" fill="#8aa27e" opacity=".8" transform="rotate(52 178 133)"/>
                    <text x="200" y="260" text-anchor="middle" fill="#f8f7f2" font-size="220" font-weight="700" font-family="Playfair Display, Georgia, serif">B</text>
                </svg>
            </div>
            <div class="logo-note">
                <h2>Logo de profil</h2>
                <p>Version ronde en 400 &times; 400 px, adaptee a la photo de profil LinkedIn.</p>
            </div>
        </section>
    </main>
</body>
</html>
